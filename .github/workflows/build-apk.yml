name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev automake build-essential \
            ccache

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build APK with Buildozer
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer_output.log

      - name: Show error summary
        if: always()
        run: |
          echo "======================================"
          echo "LAST 60 LINES OF LOG:"
          echo "======================================"
          tail -60 buildozer_output.log
          echo "======================================"
          echo "LINES LOOKING LIKE REAL ERRORS:"
          echo "======================================"
          grep -n -E "error:|Error:|FAILED|fatal error|undefined reference|No such file|ImportError|ModuleNotFoundError|CalledProcessError" buildozer_output.log | grep -v -- "-Werror" | tail -60 || echo "(no matches found)"

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bbb-sounds-apk
          path: bin/*.apk

      - name: Upload full log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-log
          path: buildozer_output.log
        
